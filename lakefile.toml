name = "RockafellarWets"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RockafellarWets"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "fixed-point-theorems"
git = "https://github.com/harfe/fixed-point-theorems-lean4.git"
rev = "2bbc5dcf5e17fe8dc2afeea6465a8270b60ce8a3"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "RockafellarWets"
